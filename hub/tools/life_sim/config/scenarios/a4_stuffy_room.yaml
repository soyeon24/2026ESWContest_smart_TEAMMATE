# §A 보조: 닫힌 방 — CO₂ 가 올라 환경 원인이 함께 커진다. 깨운 뒤에도 CO₂ 때문에 C_fatigue 가 0.3~0.7 에 머물러
# FOCUS 로 못 돌아오고, 환기(창문) 제안을 수락해야 회복된다. 확률 반응(대본 없음).
scenario:
  name: a4_stuffy_room
  description: 90 분 몰입(닫힌 방, CO₂ 상승) → 오후 졸음 → 깨우기 → 환기 권유 → 회복
  seed: 7
  persona: student
  start_local: "2026-10-22T13:00:00"
  fsm_config: demo
  reaction_profile: stochastic
  weather: {temp_c: 17.0, humidity: 50, wind_ms: 1.0, condition: clear}
  timeline:
    - {kind: upright, duration_s: 5400, typing: true, fatigue: [0.0, 0.3], window_open: false, label: 착석·기준선·몰입 90 분(닫힌 방)}
